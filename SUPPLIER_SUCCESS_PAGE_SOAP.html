<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Success - DEBUG VERSION</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .debug-info { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .debug-error { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .debug-success { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-success text-white text-center">
                        <h3><i class="fas fa-check-circle"></i> Payment Success - DEBUG MODE</h3>
                    </div>
                    <div class="card-body">
                        <!-- DEBUG INFORMATION -->
                        <div class="debug-info">
                            <h5><i class="fas fa-bug"></i> DEBUG INFORMATION</h5>
                            <div id="debug-details"></div>
                        </div>

                        <!-- ORDER INFORMATION -->
                        <div class="alert alert-info">
                            <h6><i class="fas fa-shopping-cart"></i> Order Details:</h6>
                            <p><strong>Order ID:</strong> <span id="order-id">Loading...</span></p>
                            <p><strong>Session ID:</strong> <span id="session-id">Loading...</span></p>
                            <p><strong>Supplier ID:</strong> <span id="supplier-id">Loading...</span></p>
                        </div>

                        <!-- STATUS MESSAGE -->
                        <div id="status-message" class="alert alert-warning">
                            <i class="fas fa-spinner fa-spin"></i> Initializing payment completion...
                        </div>

                        <!-- MANUAL TEST BUTTONS -->
                        <div class="mt-3">
                            <button class="btn btn-primary me-2" onclick="testPaymentCompletion()">
                                <i class="fas fa-play"></i> Test Payment Completion
                            </button>
                            <button class="btn btn-info me-2" onclick="testHealthCheck()">
                                <i class="fas fa-heartbeat"></i> Test Health Check
                            </button>
                            <button class="btn btn-warning" onclick="showDebugInfo()">
                                <i class="fas fa-eye"></i> Show Debug Info
                            </button>
                        </div>

                        <!-- HOME BUTTON (hidden initially) -->
                        <div class="mt-4 text-center">
                            <button id="home-button" class="btn btn-success" style="display: none;" onclick="goHome()">
                                <i class="fas fa-home"></i> Go Home
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Extract URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order_id') || urlParams.get('orderId') || 'UNKNOWN';
        const supplierId = urlParams.get('supplier_id') || urlParams.get('supplierId') || 'UNKNOWN';
        const sessionId = urlParams.get('session_id') || urlParams.get('sessionId') || 'SUCCESS_' + orderId + '_' + Date.now();
        
        // Display order information
        document.getElementById('order-id').textContent = orderId;
        document.getElementById('session-id').textContent = sessionId;
        document.getElementById('supplier-id').textContent = supplierId;
        
        // DEBUG: Log all information
        console.log('=== PAYMENT SUCCESS DEBUG PAGE ===');
        console.log('Order ID:', orderId);
        console.log('Supplier ID:', supplierId);
        console.log('Session ID:', sessionId);
        console.log('URL Parameters:', Object.fromEntries(urlParams.entries()));
        console.log('Current URL:', window.location.href);
        console.log('=================================');
        
        // Function to show debug information
        function showDebugInfo() {
            const debugDiv = document.getElementById('debug-details');
            debugDiv.innerHTML = `
                <div class="debug-info">
                    <h6>URL Analysis:</h6>
                    <p><strong>Full URL:</strong> ${window.location.href}</p>
                    <p><strong>Pathname:</strong> ${window.location.pathname}</p>
                    <p><strong>Search:</strong> ${window.location.search}</p>
                    <p><strong>Hash:</strong> ${window.location.hash}</p>
                </div>
                <div class="debug-info">
                    <h6>Extracted Parameters:</h6>
                    <p><strong>order_id:</strong> ${urlParams.get('order_id')}</p>
                    <p><strong>orderId:</strong> ${urlParams.get('orderId')}</p>
                    <p><strong>supplier_id:</strong> ${urlParams.get('supplier_id')}</p>
                    <p><strong>supplierId:</strong> ${urlParams.get('supplierId')}</p>
                    <p><strong>session_id:</strong> ${urlParams.get('session_id')}</p>
                    <p><strong>sessionId:</strong> ${urlParams.get('sessionId')}</p>
                </div>
                <div class="debug-info">
                    <h6>Final Values Used:</h6>
                    <p><strong>Order ID:</strong> ${orderId}</p>
                    <p><strong>Supplier ID:</strong> ${supplierId}</p>
                    <p><strong>Session ID:</strong> ${sessionId}</p>
                </div>
            `;
        }
        
        // Function to test health check
        async function testHealthCheck() {
            try {
                const statusElement = document.getElementById('status-message');
                statusElement.innerHTML = '<div class="spinner-border spinner-border-sm text-info"></div> Testing health check...';
                
                console.log('🧪 Testing health check endpoint...');
                const response = await fetch('/api/payment-success/test');
                
                console.log('📡 Health check response status:', response.status);
                console.log('📡 Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                console.log('✅ Health check result:', result);
                
                statusElement.innerHTML = `
                    <div class="alert alert-success">
                        <i class="fas fa-check-circle"></i> Health check successful!
                        <br><strong>Status:</strong> ${result.status}
                        <br><strong>Message:</strong> ${result.message}
                    </div>
                `;
                
            } catch (error) {
                console.error('❌ Health check failed:', error);
                document.getElementById('status-message').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-times-circle"></i> Health check failed: ${error.message}
                    </div>
                `;
            }
        }
        
        // Function to test payment completion
        async function testPaymentCompletion() {
            try {
                const statusElement = document.getElementById('status-message');
                statusElement.innerHTML = '<div class="spinner-border spinner-border-sm text-primary"></div> Testing payment completion...';
                
                console.log('🧪 Testing payment completion...');
                console.log('Endpoint:', '/api/payment-success/success/' + sessionId);
                console.log('Request body:', { orderId, supplierId });
                
                const response = await fetch('/api/payment-success/success/' + sessionId, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        orderId: orderId,
                        supplierId: supplierId
                    })
                });
                
                console.log('📡 Payment completion response status:', response.status);
                console.log('📡 Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('❌ Response not OK:', errorText);
                    throw new Error(`HTTP ${response.status}: ${response.statusText} - ${errorText}`);
                }
                
                const result = await response.json();
                console.log('✅ Payment completion result:', result);
                
                if (result.success) {
                    statusElement.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i> Payment completion successful!
                            <br><strong>Order ID:</strong> ${result.orderId}
                            <br><strong>Payment ID:</strong> ${result.paymentId}
                            <br><strong>Status:</strong> ${result.status}
                            <br><strong>Amount:</strong> ${result.currency} ${result.amount}
                        </div>
                    `;
                } else {
                    statusElement.innerHTML = `
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle"></i> Payment completion returned false:
                            <br><strong>Error:</strong> ${result.error || 'Unknown error'}
                        </div>
                    `;
                }
                
            } catch (error) {
                console.error('❌ Payment completion test failed:', error);
                document.getElementById('status-message').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-times-circle"></i> Payment completion test failed: ${error.message}
                    </div>
                `;
            }
        }
        
        // Function to go home
        function goHome() {
            window.location.href = '/';
        }
        
        // Auto-run health check on page load
        setTimeout(() => {
            testHealthCheck();
        }, 1000);
        
        // Show debug info on page load
        setTimeout(() => {
            showDebugInfo();
        }, 500);
    </script>
</body>
</html>
