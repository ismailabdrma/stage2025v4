<header class="swoo-header">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <div class="hotline">
          <span>Hotline 24/7</span>
          <span class="phone">(005) 3885 25 16</span>
        </div>
        <div class="top-links">
          <a href="#" class="top-link">Sell on Swooo</a>
          <a href="#" class="top-link">Order Track</a>
          <div class="dropdown">
            <span class="top-link">USD</span>
            <i class="fas fa-chevron-down"></i>
          </div>
          <div class="dropdown">
            <span class="top-link">Eng</span>
            <i class="fas fa-chevron-down"></i>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Header -->
  <div class="main-header">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <!-- Logo -->
        <div class="logo">
          <span class="logo-icon">
            <i class="fas fa-shopping-cart"></i>
          </span>
          <span class="logo-text">SWOO TECH MART</span>
        </div>

        <!-- Navigation -->
        <nav class="main-nav">
          <ul class="nav-list">
            <li class="nav-item">
              <a href="#" class="nav-link">HOMES</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">PAGES <i class="fas fa-chevron-down"></i></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">PRODUCTS <i class="fas fa-chevron-down"></i></a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link">CONTACT</a>
            </li>
          </ul>
        </nav>

        <!-- User Actions -->
        <div class="user-actions">
          <button class="action-btn" title="Wishlist">
            <i class="fas fa-heart"></i>
          </button>
          <div class="user-info">
            <span class="welcome-text">WELCOME LOG IN / REGISTER</span>
          </div>
          <div class="cart-info">
            <button class="cart-btn" title="Cart">
              <i class="fas fa-shopping-cart"></i>
              <span class="cart-count">5</span>
            </button>
            <span class="cart-total">$1,689.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search Banner -->
  <div class="search-banner">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <div class="search-container">
            <select class="category-dropdown">
              <option>All Categories</option>
              <option>Laptops</option>
              <option>PC & Computers</option>
              <option>Cell Phones</option>
              <option>Tablets</option>
              <option>Gaming & VR</option>
              <option>Networking</option>
              <option>Cameras</option>
              <option>Sounds</option>
              <option>Office</option>
              <option>Storage</option>
              <option>USB</option>
              <option>Accessories</option>
              <option>Clearance</option>
            </select>
            <input type="text" class="search-input" placeholder="Search anything...">
            <button class="search-button">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="promo-text">
            <span>FREE SHIPPING OVER $199</span>
            <span>30 DAYS MONEY BACK</span>
            <span>100% SECURE PAYMENT</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
