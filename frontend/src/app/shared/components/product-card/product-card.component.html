<a class="product-card" [routerLink]="['/products', product.id]">
  <img [src]="(product.imageUrls && product.imageUrls.length ? product.imageUrls[0] : 'assets/placeholder.png')"
       [alt]="product.name"
       class="product-image">
  <div class="product-info">
    <h3>{{ product.name }}</h3>
    <div class="price">{{ product.displayedPrice | currency }}</div>
  </div>
</a>
