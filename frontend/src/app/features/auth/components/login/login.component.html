<div class="swoo-auth-page">
  <!-- Breadcrumbs -->
  <div class="breadcrumbs">
    <div class="container">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item"><a href="#">pages</a></li>
          <li class="breadcrumb-item active" aria-current="page">Login</li>
        </ol>
      </nav>
    </div>
  </div>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="swoo-auth-card">
          <div class="auth-header">
            <h2 class="auth-title">Login</h2>
            <p class="auth-subtitle">WELCOME BACK</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="swoo-form">
            <div class="form-group">
              <label for="email">Email Address *</label>
              <input 
                type="email" 
                id="email" 
                formControlName="email" 
                placeholder="Enter your email address"
                [class.error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
              <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
                Please enter a valid email address
              </div>
            </div>

            <div class="form-group">
              <label for="password">Password *</label>
              <div class="password-input-group">
                <input 
                  [type]="showPassword ? 'text' : 'password'" 
                  id="password" 
                  formControlName="password" 
                  placeholder="Enter your password"
                  [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <button type="button" class="password-toggle" (click)="togglePassword()">
                  <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                </button>
              </div>
              <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                Password is required
              </div>
            </div>

            <div class="form-options">
              <label class="checkbox-label">
                <input type="checkbox" formControlName="rememberMe">
                <span class="checkmark"></span>
                Remember me
              </label>
              <a routerLink="/auth/forgot-password" class="forgot-password-link">Forgot Password?</a>
            </div>

            <button type="submit" class="auth-btn" [disabled]="!loginForm.valid || isSubmitting">
              <span *ngIf="!isSubmitting">LOGIN</span>
              <span *ngIf="isSubmitting">Logging in...</span>
            </button>

            <!-- Social Login -->
            <div class="social-login">
              <div class="divider">
                <span>Or continue with</span>
              </div>
              
              <div class="social-buttons">
                <button type="button" class="social-btn google-btn" (click)="loginWithGoogle()">
                  <i class="fab fa-google"></i>
                  Google
                </button>
                <button type="button" class="social-btn facebook-btn" (click)="loginWithFacebook()">
                  <i class="fab fa-facebook-f"></i>
                  Facebook
                </button>
              </div>
            </div>
          </form>

          <div class="auth-footer">
            <p>Don't have an account? <a routerLink="/auth/signup">Sign up here</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
