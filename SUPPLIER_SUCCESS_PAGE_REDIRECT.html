<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiement Réussi - Fournisseur</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .success-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }
        
        .success-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #28a745, #20c997, #17a2b8);
        }
        
        .success-icon {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            animation: bounce 1s ease-in-out;
        }
        
        h1 {
            color: #28a745;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 700;
        }
        
        .success-message {
            font-size: 1.2rem;
            color: #6c757d;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .redirect-info {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 1.5rem;
            margin: 2rem 0;
            border: 1px solid #dee2e6;
        }
        
        .countdown {
            font-size: 2rem;
            font-weight: 700;
            color: #007bff;
            margin: 1rem 0;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 1rem auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        
        @media (max-width: 768px) {
            .success-card {
                padding: 2rem;
                margin: 1rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="success-icon">🎉</div>
        <h1>Paiement Réussi!</h1>
        <div class="success-message">
            <p>Votre paiement a été traité avec succès par notre système.</p>
            <p>Merci pour votre commande!</p>
        </div>
        
        <div class="redirect-info">
            <h3>Redirection en cours...</h3>
            <p>Vous allez être redirigé vers notre plateforme pour confirmer votre commande.</p>
            <div class="countdown" id="countdown">3</div>
            <div class="loading-spinner"></div>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const returnUrl = urlParams.get('return_url');
        const orderId = urlParams.get('order_id');
        const supplierId = urlParams.get('supplier_id');
        
        console.log('🔗 Supplier success page loaded');
        console.log('📋 Return URL:', returnUrl);
        console.log('📦 Order ID:', orderId);
        console.log('🏪 Supplier ID:', supplierId);
        
        if (!returnUrl) {
            console.error('❌ No return URL provided');
            document.querySelector('.redirect-info').innerHTML = `
                <h3>Erreur de Configuration</h3>
                <p>Aucune URL de retour n'a été fournie. Veuillez contacter le support.</p>
            `;
            return;
        }
        
        // Countdown and redirect
        let countdown = 3;
        const countdownElement = document.getElementById('countdown');
        
        const countdownInterval = setInterval(() => {
            countdown--;
            countdownElement.textContent = countdown;
            
            if (countdown <= 0) {
                clearInterval(countdownInterval);
                
                // Build the redirect URL with all necessary parameters
                const redirectUrl = new URL(returnUrl);
                
                // Add any additional parameters that might be useful
                if (orderId) redirectUrl.searchParams.set('order_id', orderId);
                if (supplierId) redirectUrl.searchParams.set('supplier_id', supplierId);
                redirectUrl.searchParams.set('payment_type', 'supplier_own');
                redirectUrl.searchParams.set('timestamp', Date.now().toString());
                
                console.log('🚀 Redirecting to:', redirectUrl.toString());
                
                // Redirect to our platform's success page
                window.location.href = redirectUrl.toString();
            }
        }, 1000);
        
        // Also allow immediate redirect if user clicks
        document.addEventListener('click', () => {
            clearInterval(countdownInterval);
            const redirectUrl = new URL(returnUrl);
            if (orderId) redirectUrl.searchParams.set('order_id', orderId);
            if (supplierId) redirectUrl.searchParams.set('supplier_id', supplierId);
            redirectUrl.searchParams.set('payment_type', 'supplier_own');
            redirectUrl.searchParams.set('timestamp', Date.now().toString());
            
            console.log('🚀 Immediate redirect to:', redirectUrl.toString());
            window.location.href = redirectUrl.toString();
        });
    </script>
</body>
</html>
