<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Error - Something Went Wrong</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            color: white;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .error-details {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin: 10px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">❌</div>
        <h1>Payment Error</h1>
        <p>Something went wrong with your payment. Please try again or contact support.</p>
        
        <div class="error-details" id="errorDetails">
            <h3>Error Details</h3>
            <p><strong>Error:</strong> <span id="errorMessage">Unknown error occurred</span></p>
            <p><strong>Session ID:</strong> <span id="sessionId">N/A</span></p>
            <p><strong>Time:</strong> <span id="errorTime">N/A</span></p>
        </div>
        
        <div style="margin-top: 30px;">
            <a href="/" class="btn">Go Home</a>
            <a href="/cart" class="btn">Return to Cart</a>
            <a href="/contact" class="btn">Contact Support</a>
        </div>
    </div>

    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const sessionId = urlParams.get('sessionId');

        // Display error information
        if (error) {
            document.getElementById('errorMessage').textContent = decodeURIComponent(error);
        }
        if (sessionId) {
            document.getElementById('sessionId').textContent = sessionId;
        }
        
        document.getElementById('errorTime').textContent = new Date().toLocaleString();

        // Auto-redirect to home page after 30 seconds
        setTimeout(() => {
            window.location.href = '/';
        }, 30000);
    </script>
</body>
</html>
